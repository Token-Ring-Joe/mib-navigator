name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        MIB Navigator is a lab and MIB-engineering tool, not a network management system. Requests that fit that scope (browsing and checking MIBs, querying devices, tables, Watch, traps) are most useful.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem first, then the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: workaround
    attributes:
      label: How do you do it today?
      description: Another tool or a manual workaround, if any.
  - type: input
    id: version
    attributes:
      label: MIB Navigator version
      description: Shown in Help > About.
